---
# opskit ansible-lint config — migration phase (lenient)
# Will be tightened in post-migration cleanup per GPA standards.

exclude_paths:
  # Local environment layer — gitignored real data, generated/imported rather
  # than authored, and absent in CI. Linting it locally would make `make lint`
  # disagree with CI (issue #19), and the findings are not repo code.
  - environments/
  - ansible/roles/frappe-upgrade/
  - ansible/roles/frappe-bench/
  - ansible/roles/frappe-site/
  - ansible/roles/mariadb-frappe/
  - ansible/roles/frappe-dependencies/

skip_list:
  # NOTE: never add syntax-check (or any of its sub-rules) here — it is
  # unskippable, and listing it makes ansible-lint refuse to run at all rather
  # than skip that one rule. See #83: the entry silently prevented every
  # playbook and role in this repo from ever being linted. Exclude a file via
  # exclude_paths if it genuinely cannot pass.
  - schema[meta]
  - name[casing]
  - fqcn[action-core]

# warn_list entries are deliberate decisions, not deferred work (#87). Each one
# is a rule this repo has judged and chosen not to enforce as an error; anything
# genuinely worth fixing was fixed rather than listed here.
warn_list:
  - experimental
  - no-changed-when
  - no-handler
  - risky-file-permissions
  - risky-shell-pipe

  # Long single-line Jinja fact expressions (dmidecode/ipmi parsing, chained
  # filters) are more readable unwrapped than folded across lines, and
  # `ansible-lint --fix` demonstrated it will split an escaped regex across a
  # YAML line continuation while wrapping them. Length is a style preference;
  # a mangled regex is a defect. Kept visible as a warning.
  - yaml[line-length]

  # Role-scoped variables without the role-name prefix. These roles are
  # self-contained and referenced by no playbook in the repo, so the prefix buys
  # no collision safety today, while renaming ~17 documented variables
  # (db_name, db_password, php_timezone …) would silently break any caller that
  # sets them by their current names. Revisit when a role is first consumed.
  - var-naming[no-role-prefix]

  # args[module] is genuinely useful — it caught real argument errors in
  # ansible/playbooks/mikrotik-configure-rest-api.yml — but that playbook is
  # broken independently of linting and tracked separately. Left as a warning so
  # the findings stay visible rather than excluded.
  - args[module]
