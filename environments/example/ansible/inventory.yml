# Example environment inventory — conforms to opskit inventory conventions (§7-5)
all:
  children:
    example:
      children:
        routers:
          hosts:
            ex-gw-01:
        switches:
          hosts:
            ex-sw-01:
        servers:
          children:
            infrastructure:
              hosts:
                ex-srv-01:
            application:
              hosts:
                ex-srv-02:
        access_points:
          hosts:
            ex-ap-01:
        # Group name is load-bearing: ansible/playbooks/configure-dns-zones.yml
        # targets `hosts: dns_server` literally. group_vars/dns_server.yml
        # defines the dns_zones this group's records are drawn from.
        dns_server:
          hosts:
            ex-dns-01:
