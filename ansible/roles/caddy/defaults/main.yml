---
caddy_config_path: /etc/caddy/Caddyfile
caddy_systemd_service: caddy

caddy_global_email: support@cascadesteam.org

# Admin API bind address. Loopback-only by default; an environment that scrapes
# Caddy metrics remotely overrides this in its group_vars. Parameterised so a
# redeploy does not silently revert such an environment to loopback (#184).
caddy_admin_listen: 127.0.0.1:2019

# Real subnets and WAN/office addresses belong in environments/<env>/
# group_vars, never in committed defaults (docs/client-data-policy.md).
# These are RFC 5737 documentation-range placeholders showing the shape.
caddy_internal_subnets:
  - 192.0.2.0/24
  - 198.51.100.0/24
  - 203.0.113.194

# All real vhosts — org and client alike — live in environments/<env>/
# group_vars (override caddy_routes there). The default is empty on purpose:
# placeholder domains would render into a live Caddyfile and trigger ACME
# attempts for names this host does not own.
caddy_routes: []
# Per-route options:
#   target        upstream host:port for reverse_proxy (required unless handler set)
#   internal      restrict to caddy_internal_subnets (import internal_only)
#   extra         raw Caddyfile directives inserted before reverse_proxy
#                 (e.g. `redir / /path` for an exact-root redirect)
#   handler       "file_server" to serve /var/www/html instead of proxying
#   upstream_host rewrite the Host header sent upstream (header_up Host <value>);
#                 use when the upstream resolves its site from the inbound Host
#                 but this vhost's public name differs from that site's name.
#   backend_tls_skip_verify
#                 speak HTTPS to the backend (target still host:port — the
#                 scheme is added automatically) without verifying its cert;
#                 use for an upstream that is HTTPS-only with a self-signed
#                 cert (no public name of its own). Caddy's own public-facing
#                 TLS (real Let's Encrypt) is unaffected — this only weakens
#                 the Caddy->backend hop.
#   tls_internal  use Caddy's local CA instead of public ACME for this vhost's
#                 own TLS. Required for any domain that will never have a
#                 public DNS record — automatic HTTPS otherwise always tries
#                 Let's Encrypt/ZeroSSL HTTP-01/TLS-ALPN-01, which needs public
#                 resolution and fails (NXDOMAIN) with endless retries
#                 otherwise. Note `internal: true` does NOT imply this — it
#                 only restricts source IP, it says nothing about whether the
#                 domain is publicly resolvable.
# Example (documentation ranges/domains only):
# caddy_routes:
#   - domain: helpdesk.example.org
#     target: 192.0.2.10:80
#     internal: false
#   - domain: alias.example.org      # serves the "canonical.example.org" upstream site
#     target: 192.0.2.10:80
#     upstream_host: canonical.example.org
#     internal: false
#   - domain: monitoring.example.org
#     target: 192.0.2.21:80
#     internal: true
#     extra: |
#       redir / /zabbix/
#   - domain: files.example.org
#     target: ""
#     internal: true
#     handler: file_server
#   - domain: dev-clone.example.org  # never has a public DNS record
#     target: 192.0.2.30:8080
#     internal: true
#     tls_internal: true
