---
# Olla role defaults.
#
# These are defaults (not vars/) so the environment layer can override them:
# the real cluster node list lives in environments/<env>/ansible/group_vars/,
# never in this committed file (docs/client-data-policy.md). The nodes below
# are RFC 5737 documentation-range placeholders showing the expected shape.
olla_image: "ghcr.io/thushan/olla:latest"
olla_container_name: "olla"
olla_port: 40114
olla_log_path: "/var/log/olla.log"

# Ollama cluster nodes — override per environment.
# Priority: higher = preferred first
olla_nodes:
  - name: "hub-example"
    url: "http://192.0.2.10:11434"
    priority: 100
    check_interval: 15s
    check_timeout: 5s
  - name: "spoke-example"
    url: "http://192.0.2.11:11434"
    priority: 75
    check_interval: 15s
    check_timeout: 5s

# LiteLLM cloud gateway (deployed in Phase 2)
olla_litellm_url: "http://localhost:4000"
olla_litellm_priority: 50
olla_litellm_check_interval: 30s
olla_litellm_check_timeout: 10s

# Olla configuration
olla_engine: "sherpa" # or "olla" for circuit breakers
olla_load_balancer: "least-connections"
olla_request_logging: true
olla_write_timeout: "600s"
olla_response_timeout: "600s"
olla_connection_timeout: "30s"
olla_model_discovery_interval: "5m"
olla_log_level: "info"
