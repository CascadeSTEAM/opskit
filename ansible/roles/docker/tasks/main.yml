---
# docker role — Install Docker Engine + Compose v2 from Docker's own upstream
# apt repository on a Debian or Ubuntu host (opskit #231, extracted to a role
# in #241 so provision-runner-lxc.yml and install-docker.yml share one copy
# instead of two drifting inline blocks).
#
# Docker's own repo, not the distro package: the distro's docker.io lags
# upstream, and stacks managed by ansible/roles/erp_stack (and similar
# compose-based roles) need current Compose v2 support.
#
# Idempotent: does nothing if `docker compose version` already succeeds.

- name: Check whether Docker Compose v2 is already installed
  # `docker compose version` (not bare `docker --version`), deliberately: a
  # host with distro docker.io, a snap package, or an old CE install missing
  # the compose plugin would pass a bare version check and this role would
  # then wrongly report the precondition satisfied (opskit #241) — this repo's
  # compose-based stack roles need Compose v2 specifically, not just any
  # Docker binary.
  ansible.builtin.command: docker compose version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Install Docker Engine and Compose v2
  when: docker_check.rc != 0
  block:
    - name: Reject a distribution this role doesn't know how to handle
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
        fail_msg: >-
          {{ ansible_facts['distribution'] }} is neither Debian nor
          Ubuntu — Docker's upstream repo path differs per distro
          (download.docker.com/linux/<distro>) and this role only
          knows those two. Extend it deliberately rather than guessing
          a repo URL that silently matches zero packages.

    - name: Install apt prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          # deb822_repository depends on python3-debian, which a fresh
          # image doesn't have (opskit #209, hit live provisioning the
          # runner LXC — same fix, same reasoning, reapplied here).
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    # get_url never creates its destination's parent directory, and
    # /etc/apt/keyrings only exists by default on Debian 12+/Ubuntu 22.04+
    # — absent on Debian 11/Ubuntu 20.04, both still in Docker's
    # supported repo matrix and this role's stated Debian-or-Ubuntu scope.
    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    # ansible_facts['architecture'] reports the uname-style name
    # ("x86_64"), not the Debian/Ubuntu archive name apt actually
    # expects ("amd64") — using it directly writes an
    # Architectures: x86_64 sources file that apt silently matches zero
    # packages against (opskit #209, same trap, reapplied fix here).
    - name: Determine the apt architecture name for the Docker repo
      ansible.builtin.command: dpkg --print-architecture
      register: docker_deb_arch
      changed_when: false

    - name: Add the Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ docker_deb_arch.stdout }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker Engine and the Compose v2 plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

- name: Report
  ansible.builtin.debug:
    msg: >-
      Docker {{ 'already present: ' ~ docker_check.stdout
                 if docker_check.rc == 0
                 else 'installed from the upstream apt repository.' }}
