---
# provision-erpnext-dev-lxc.yml — Create an LXC container on a Proxmox node to
# host an ERPNext Docker Compose *development* deployment (opskit #150).
#
# Per .opencode/rules/iac-required.md the container is system/deployment state,
# so its rebuild path is this playbook, not a hand-run `pct create`.
#
# SAFETY POSTURE
#   - Idempotent: an existing container is never recreated or destroyed. If the
#     target ID is in use by something that does not look like this container,
#     the play FAILS rather than adopting or overwriting it.
#   - Default-deny firewall: no port forwarding, no permit rules. Proxmox needs
#     THREE things for that to mean anything — the datacenter firewall switch,
#     the vNIC's firewall=1, and the guest rules file — so the play asserts the
#     first before creating anything and reports honestly if it is off (#187).
#     This container will later hold a clone of Confidential production data;
#     hardening and the data restore are separate tasks and out of scope here.
#   - No infrastructure values are hardcoded. Every address, node, and pool is
#     a variable, and ct_ip has NO default — the address is not yet allocated,
#     so the play must fail loudly rather than invent one.
#
# SIZING: deliberately generous. The production deployment this mirrors is
# disk-constrained and that constraint is explicitly NOT reproduced here.
# Override any of the ct_* variables to suit the target node.
#
# Run from this repo root:
#   ansible-playbook -i environments/$ACTIVE_ENV/ansible/inventory.yml \
#     ansible/playbooks/provision-erpnext-dev-lxc.yml \
#     -e target_host=<proxmox-node-alias> -e ct_id=<id> \
#     -e ct_ip=<address/prefix> -e ct_gateway=<address>
#
# Dry run first: add --check.

- name: Provision an ERPNext development LXC container
  # target_host is supplied at run time with `-e target_host=<host>`; the
  # linter cannot know that, and the assert below fails loudly if it is
  # missing. A per-line ignore, never skip_list — syntax-check is unskippable
  # and listing it there stops ansible-lint running at all (#83).
  hosts: "{{ target_host }}"  # noqa: syntax-check[specific]
  gather_facts: false

  vars:
    # --- Required, no defaults. See the assert below. --------------------
    # ct_id        container ID to create
    # ct_ip        CIDR address for the container, e.g. 192.0.2.50/24
    # ct_gateway   default gateway for the container

    # --- Sizing: generous on purpose, all overridable --------------------
    ct_hostname: erpnext-dev
    ct_cores: 4
    ct_memory_mb: 8192
    ct_swap_mb: 4096
    ct_disk_gb: 120

    # --- Placement -------------------------------------------------------
    ct_storage: local-lvm
    ct_template_storage: local
    ct_bridge: vmbr0
    ct_ostemplate_name: debian-12-standard_12.12-1_amd64.tar.zst
    ct_unprivileged: true
    ct_onboot: false
    ct_start_after_create: false

    # A container firewall is only real when the datacenter firewall is on.
    # Set false to provision knowingly WITHOUT isolation (#187).
    require_datacenter_firewall: true

  tasks:
    - name: Require the parameters that must never be guessed
      ansible.builtin.assert:
        that:
          - ct_id is defined
          - ct_ip is defined
          - ct_gateway is defined
        fail_msg: >-
          Pass -e ct_id=<id> -e ct_ip=<address/prefix> -e ct_gateway=<address>.
          The container address is allocated per environment and has no default
          on purpose: inventing one would either collide with a live host or
          silently create an unreachable container.

    - name: Reject an address that is not in CIDR form
      ansible.builtin.assert:
        that:
          - "'/' in ct_ip"
        fail_msg: >-
          ct_ip must include a prefix length (e.g. 192.0.2.50/24). Without one
          pct assumes /24, which is a guess about someone else's network.

    # A guest firewall is inert unless the DATACENTER firewall is on. Proxmox
    # needs all three: this switch, the vNIC's firewall=1, and the guest's own
    # rules file. With the switch off, the other two are configuration no packet
    # ever meets — and the run would still report "network-isolated" (#187).
    #
    # Checked BEFORE the container is created, so a refusal costs nothing and
    # never leaves a half-provisioned node behind.
    #
    # A stat check first, not a second error-message string to match: this
    # block used to distinguish "file genuinely absent" from "read error"
    # purely by matching slurp's error text ("No such file"), which broke
    # live on a node with no firewall config at all once ansible-core's
    # wording changed to "File not found: ..." (opskit #209, backported
    # here after being fixed live in provision-runner-lxc.yml — same bug,
    # copied logic, same fix).
    - name: Check whether the datacenter firewall config file exists at all
      ansible.builtin.stat:
        path: /etc/pve/firewall/cluster.fw
      register: cluster_fw_stat

    - name: Read the datacenter firewall switch
      ansible.builtin.slurp:
        src: /etc/pve/firewall/cluster.fw
      register: cluster_fw
      failed_when: false
      when: cluster_fw_stat.stat.exists

    # `| bool` is NOT used on the opt-out. Ansible's bool filter maps any
    # unrecognised string to false without complaint, so a typo —
    # `-e require_datacenter_firewall=treu`, or an empty value — would silently
    # switch the guard off. That is the same "reports success while not
    # guarding" failure this whole change exists to remove, reproduced inside
    # its own escape hatch. Only the exact literals are accepted.
    - name: Reject an unrecognised value for the isolation requirement
      ansible.builtin.assert:
        that:
          - require_datacenter_firewall in [true, false, 'true', 'false', 'True', 'False']
        fail_msg: >-
          require_datacenter_firewall is
          '{{ require_datacenter_firewall }}', which is neither true nor false.
          Refusing to guess: an unrecognised value would otherwise be read as
          false and quietly disable the isolation check.

    - name: Establish whether the datacenter firewall is enabled
      # The LAST enable: under [OPTIONS] wins, not the first match anywhere in
      # the file. A leftover second [OPTIONS] block from a bad edit or restore
      # would otherwise let an earlier `enable: 1` mask the effective `enable: 0`.
      ansible.builtin.set_fact:
        datacenter_firewall_on: >-
          {{ cluster_fw_stat.stat.exists
             and (cluster_fw.content is defined)
             and (((cluster_fw.content | b64decode)
                   | regex_findall('(?m)^\s*enable:\s*([01])\s*$')
                   | last | default('0')) == '1') }}
        # Unreadable means: the file exists (confirmed by stat) but slurp
        # still couldn't read it — a real permissions/connection problem.
        # A file that plain doesn't exist is not an error case; it's "off".
        datacenter_firewall_unreadable: >-
          {{ cluster_fw_stat.stat.exists and (cluster_fw.content is not defined) }}

    - name: Refuse to claim isolation the datacenter firewall would not deliver
      # | bool on require_datacenter_firewall: without it,
      # -e require_datacenter_firewall=false arrives as the STRING "false"
      # — truthy in Jinja — so `not require_datacenter_firewall` silently
      # never fired even when explicitly opted out. Backported from
      # provision-runner-lxc.yml after being caught live there (opskit
      # #209) — same copied logic, same bug, same fix. Safe here for the
      # same reason: by this point the value has already passed the
      # strict literal-list assert above, so it's one of the accepted
      # spellings and | bool converts it correctly.
      ansible.builtin.assert:
        that:
          - datacenter_firewall_on or not (require_datacenter_firewall | bool)
          - not (datacenter_firewall_unreadable | bool)
        fail_msg: >-
          {{ 'Could NOT READ /etc/pve/firewall/cluster.fw on ' ~ target_host ~
             ' (' ~ (cluster_fw.msg | default('unknown error')) ~ '). The
             firewall may well be enabled — this is most likely a permissions
             or connection problem, so fix that rather than disabling the
             check. Do NOT reach for require_datacenter_firewall=false here:
             that would turn a read failure into a real loss of isolation.'
             if (datacenter_firewall_unreadable | bool)
             else 'The datacenter firewall is NOT enabled on ' ~ target_host ~
             ' (/etc/pve/firewall/cluster.fw has no effective `enable: 1`), so
             a per-container firewall does nothing: this container would be
             fully reachable while this playbook reported it isolated. Enable
             it at Datacenter -> Firewall -> Options — cluster-wide state, so
             decide it deliberately rather than as a side effect of
             provisioning one container (opskit #189). To provision WITHOUT
             isolation anyway, re-run with
             -e require_datacenter_firewall=false; the report will then say
             plainly that the container is not isolated.' }}

    - name: Read the existing container config, if any
      ansible.builtin.command: "pct config {{ ct_id }}"
      register: existing_ct
      changed_when: false
      failed_when: false

    - name: Refuse to touch a container ID already used by something else
      ansible.builtin.assert:
        that:
          - "existing_ct.stdout is search('(?m)^hostname: ' ~ ct_hostname ~ '$')"
        fail_msg: >-
          CT {{ ct_id }} already exists on {{ target_host }} and its hostname is
          not {{ ct_hostname }}. Refusing to adopt or overwrite it — pick a free
          ct_id, or confirm this really is the container you meant.
      when: existing_ct.rc == 0

    - name: Report that the container already exists
      ansible.builtin.debug:
        msg: >-
          CT {{ ct_id }} ({{ ct_hostname }}) already exists — leaving it alone.
          This play creates the container; it does not reconfigure one.
      when: existing_ct.rc == 0

    # ---- Everything below runs only when the container does not exist ----

    - name: Ensure the OS template is present on the node
      when: existing_ct.rc != 0
      block:
        - name: List templates already downloaded
          ansible.builtin.command:
            cmd: "pveam list {{ ct_template_storage }}"
          register: template_list
          changed_when: false

        - name: Refresh the template catalogue
          ansible.builtin.command: pveam update
          changed_when: true
          when: ct_ostemplate_name not in template_list.stdout

        - name: Download the OS template
          ansible.builtin.command:
            cmd: "pveam download {{ ct_template_storage }} {{ ct_ostemplate_name }}"
          changed_when: true
          when: ct_ostemplate_name not in template_list.stdout

    - name: Create the container
      ansible.builtin.command:
        cmd: >-
          pct create {{ ct_id }}
          {{ ct_template_storage }}:vztmpl/{{ ct_ostemplate_name }}
          --hostname {{ ct_hostname }}
          --cores {{ ct_cores }}
          --memory {{ ct_memory_mb }}
          --swap {{ ct_swap_mb }}
          --rootfs {{ ct_storage }}:{{ ct_disk_gb }}
          --net0 name=eth0,bridge={{ ct_bridge }},ip={{ ct_ip }},gw={{ ct_gateway }},firewall=1
          --unprivileged {{ 1 if ct_unprivileged else 0 }}
          --onboot {{ 1 if ct_onboot else 0 }}
          --features nesting=1{{ ',keyctl=1' if ct_unprivileged else '' }}
          --start 0
      changed_when: true
      when: existing_ct.rc != 0

    - name: Write a default-deny firewall rules file for the container  # noqa: command-instead-of-module
      # Third of the three things Proxmox needs, the other two being the vNIC's
      # firewall=1 and the datacenter switch asserted above. An empty rules file
      # with policy_in: DROP means nothing reaches the container until a rule is
      # added deliberately. Hardening beyond this posture is a separate task.
      #
      # A plain shell redirect, not ansible.builtin.copy. /etc/pve is pmxcfs, a
      # FUSE cluster filesystem that rejects both chmod() (the documented
      # reason `mode:` is never set on files here) and, proven live during
      # #209's runner-CT provisioning (opskit provision-runner-lxc.yml,
      # commit c80d9a5), the atomic tmp-file-plus-rename dance copy uses even
      # with unsafe_writes: true — both failed with EPERM against a real node.
      # `cat > file <<'EOF'` does nothing but open/write/close, the one
      # sequence pmxcfs actually supports. A per-line ignore: the linter's
      # suggested replacement is the module this exists to avoid.
      #
      # Still gated on existing_ct.rc != 0, deliberately: this play's contract
      # is create-only, never reconfigure (enforced by
      # test_creation_only_runs_when_the_container_is_absent). That means a
      # container that got created but whose rules file failed to write on a
      # prior run is NOT self-healed by re-running this play — it takes the
      # "already exists" branch and skips straight past this task, silently
      # leaving that container without a rules file (opskit #240).
      ansible.builtin.shell: |
        cat > /etc/pve/firewall/{{ ct_id }}.fw <<'FWEOF'
        [OPTIONS]
        enable: 1
        policy_in: DROP
        policy_out: ACCEPT

        [RULES]
        FWEOF
      when: existing_ct.rc != 0
      changed_when: true

    - name: Start the container
      ansible.builtin.command: "pct start {{ ct_id }}"
      changed_when: true
      when:
        - existing_ct.rc != 0
        - ct_start_after_create | bool

    - name: Report
      ansible.builtin.debug:
        msg: >-
          CT {{ ct_id }} ({{ ct_hostname }}) provisioned on {{ target_host }}:
          {{ ct_cores }} cores, {{ ct_memory_mb }} MB RAM, {{ ct_disk_gb }} GB disk,
          nesting+keyctl enabled.
          Firewall: default-deny rules written and vNIC firewall enabled —
          {{ 'ISOLATED (datacenter firewall is on).'
             if datacenter_firewall_on
             else 'NOT ISOLATED: the datacenter firewall is off, so these rules
                   are inert and this container is reachable.' }}
          Next: install Docker and deploy the ERPNext compose stack — separate
          tasks, deliberately not done here.
      when: existing_ct.rc != 0
