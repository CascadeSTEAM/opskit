---
# configure-ghcr-auth.yml
#
# PURPOSE: Configure docker login to ghcr.io on a deploy target so it can pull
#          private cascadesteam packages (erp-cs, etc). erp-cs is currently
#          private — see cs-erp-images CS-0029 notes.
#
# VAULT VARS REQUIRED (loaded automatically from the target's inventory
# group_vars — e.g. environments/<env>/ansible/group_vars/erp_stacks/vault.yml,
# ansible-vault encrypted):
#   vault_cs_ghcr_pull_user   — GitHub username owning the PAT
#   vault_cs_ghcr_pull_token  — classic PAT, scope: read:packages
#                                (Bitwarden: "GHCR Pull Token - cascadesteam")
#
# Connection vars (ProxyJump, IdentityFile) come from the inventory's own
# host/group vars, same as every other playbook here — this play does not
# set its own (opskit #233; the previous version hand-rolled a ProxyCommand
# that duplicated, and had drifted from, the erp_stacks group's actual vars).
#
# Usage:
#   ansible-playbook -i environments/$ACTIVE_ENV/ansible/inventory.yml \
#     ansible/playbooks/configure-ghcr-auth.yml -l <host> \
#     --vault-password-file ~/.config/opskit/vault-pass-cs

- name: Configure GHCR pull credentials
  hosts: "{{ target_host | default('erp_stacks') }}"
  gather_facts: false

  tasks:
    - name: Log in to ghcr.io
      ansible.builtin.command: "docker login ghcr.io -u {{ vault_cs_ghcr_pull_user }} --password-stdin"
      args:
        stdin: "{{ vault_cs_ghcr_pull_token }}"
      no_log: true
      changed_when: true

    - name: Verify pull of erp-cs image
      ansible.builtin.command: docker pull ghcr.io/cascadesteam/erp-cs:v16.2.0
      register: pull_check
      changed_when: false

    - name: Pull result
      ansible.builtin.debug:
        msg: "{{ pull_check.stdout_lines[-3:] }}"
